<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Watchroom alert</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      main {
        box-sizing: border-box; height: 100%; padding: 12px 16px; border: 1px solid #3a4148; border-radius: 8px;
        background: rgba(14, 16, 18, 0.95); color: #f4f1e8; font: 15px/1.35 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
      }
      b { display: block; color: #ffb020; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
      p { margin: 4px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
  </head>
  <body>
    <main><b id="title"></b><p id="text"></p></main>
    <script src="alert.js"></script>
  </body>
</html>
